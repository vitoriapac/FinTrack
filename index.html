<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1C2620;
    --forest: #24402F;
    --forest-dark: #182B20;
    --paper: #F0ECE2;
    --paper-alt: #E8E2D2;
    --card: #FBF9F3;
    --line: #D9D2BF;
    --line-soft: #E5DFCE;
    --income: #4B7A57;
    --expense: #9C4A2E;
    --gold: #B9862F;
    --muted: #766F5E;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:220px;flex-shrink:0;background:var(--forest);color:var(--paper);display:flex;flex-direction:column;padding:28px 0;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:10;}
  .brand{font-family:'Fraunces',serif;font-size:22px;font-weight:600;padding:0 24px 28px;border-bottom:1px solid rgba(240,236,226,0.15);margin-bottom:8px;}
  .brand span{color:var(--gold);}
  nav{display:flex;flex-direction:column;margin-top:8px;}
  .nav-item{all:unset;cursor:pointer;padding:12px 24px;font-size:14px;color:rgba(240,236,226,0.75);border-left:3px solid transparent;transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--paper);}
  .nav-item.active{background:var(--forest-dark);color:var(--paper);border-left:3px solid var(--gold);font-weight:500;}
  .sidebar-foot{margin-top:auto;padding:16px 24px 0;font-size:12px;color:rgba(240,236,226,0.4);border-top:1px solid rgba(240,236,226,0.15);padding-top:14px;}

  /* Main */
  main{flex:1;padding:36px 44px;max-width:1180px;min-width:0;}
  .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;}
  .page-heading{min-width:0;}
  .page-title{font-size:26px;font-weight:600;margin:0 0 4px;line-height:1.2;}
  .page-sub{color:var(--muted);margin:0;font-size:14px;}
  .page-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}

  /* Cards */
  .cards-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:28px;}
  .stat-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:17px 18px;min-width:0;}
  .stat-label{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .stat-value{font-family:'Fraunces',serif;font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;}
  .stat-value.income{color:var(--income);}
  .stat-value.expense{color:var(--expense);}
  .stat-meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35;}
  .alert-list{padding:4px 20px 14px;}
  .alert-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .alert-item:last-child{border-bottom:0;}
  .alert-mark{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:6px;flex:none;}
  .quick-actions{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px;}
  .summary-strip{display:flex;gap:20px;flex-wrap:wrap;padding:12px 20px;background:var(--paper-alt);border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--muted);}
  .summary-strip strong{color:var(--ink);font-family:'Fraunces',serif;font-size:16px;margin-left:4px;}
  .group-title{background:var(--paper-alt);color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;padding:8px 20px;text-transform:uppercase;}
  .insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 20px;}
  .insight-card{border:1px solid var(--line-soft);padding:14px;background:var(--paper);font-size:13.5px;}
  .insight-card strong{display:block;margin-bottom:4px;color:var(--forest);}
  .projection-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line-soft);}
  .projection-item{padding:16px 20px;border-right:1px solid var(--line-soft);}
  .projection-item:last-child{border-right:0;}
  .projection-item span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px;}
  .projection-item strong{font-family:'Fraunces',serif;font-size:20px;}

  /* Section */
  .section{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
  .section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line-soft);}
  .section-head h2{font-size:16px;margin:0;font-weight:600;}

  /* Tables */
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;padding:10px 20px;border-bottom:1px solid var(--line);}
  td{padding:11px 20px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.money-in,.money-in{color:var(--income);}
  td.money-out,.money-out{color:var(--expense);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{all:unset;cursor:pointer;color:var(--muted);font-size:13px;padding:3px 6px;border-radius:2px;}
  .icon-btn:hover{background:var(--paper-alt);color:var(--ink);}

  .empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .empty-state strong{display:block;color:var(--ink);font-family:'Fraunces',serif;font-size:16px;margin-bottom:6px;font-weight:500;}

  /* Buttons */
  .btn{font-family:'IBM Plex Sans',sans-serif;border:none;cursor:pointer;padding:9px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:500;}
  .btn-primary{background:var(--forest);color:var(--paper);}
  .btn-primary:hover{background:var(--forest-dark);}
  .btn-ghost{background:transparent;color:var(--forest);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-alt);}
  .btn-danger{background:transparent;color:var(--expense);}
  button:focus-visible,.btn:focus-visible,.tab-btn:focus-visible,.nav-item:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  button:disabled{opacity:.55;cursor:not-allowed;}

  /* Forms */
  .field{margin-bottom:14px;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;color:var(--muted);font-weight:500;}
  .field input, .field select{font-family:'IBM Plex Sans',sans-serif;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:#fff;color:var(--ink);}
  .field input:focus, .field select:focus{outline:2px solid var(--gold);outline-offset:0;}
  .form-row{display:flex;gap:12px;}
  .form-row .field{flex:1;}
  .checkbox-field{flex-direction:row;align-items:center;gap:8px;}
  .checkbox-field input{width:auto;}

  /* Filters */
  .filters{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line-soft);}
  .filters select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;background:#fff;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(24,32,26,0.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--card);border-radius:var(--radius);width:440px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:24px 26px;}
  .modal h3{margin:0 0 18px;font-size:19px;font-weight:600;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .form-error{color:var(--expense);font-size:12.5px;margin:-5px 0 10px;min-height:18px;}

  /* Tabs (Cadastro) */
  .tabs{display:flex;gap:4px;margin-bottom:18px;}
  .tab-btn{all:unset;cursor:pointer;padding:8px 16px;font-size:13.5px;border-radius:var(--radius);color:var(--muted);}
  .tab-btn.active{background:var(--forest);color:var(--paper);}

  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:500;}
  .badge-paid{background:rgba(75,122,87,0.15);color:var(--income);}
  .badge-pending{background:rgba(156,74,46,0.13);color:var(--expense);}

  select, input{width:100%;}
  @media (max-width:900px){main{padding:28px 24px}.cards-row{grid-template-columns:repeat(2,minmax(0,1fr))}.projection-row{grid-template-columns:repeat(2,1fr)}.projection-item:nth-child(2){border-right:0}}
  @media (max-width:640px){#app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:16px 0}.brand{padding:0 18px 14px;margin-bottom:0}.sidebar-foot{display:none}nav{display:flex;flex-direction:row;overflow:auto;margin-top:8px}.nav-item{white-space:nowrap;padding:10px 14px;border-left:0;border-bottom:3px solid transparent}.nav-item.active{border-left:0;border-bottom-color:var(--gold)}main{padding:24px 14px}.page-header{display:block;margin-bottom:20px}.page-actions{justify-content:flex-start;margin-top:14px}.cards-row{grid-template-columns:1fr 1fr;gap:10px}.stat-card{padding:14px 12px}.stat-value{font-size:22px}.section-head{padding:13px 14px;flex-wrap:wrap}.section{overflow-x:auto}table{min-width:680px}.filters{flex-wrap:wrap;padding:12px 14px}.filters select,.filters input{min-width:140px;flex:1}.insight-grid{grid-template-columns:1fr;padding:14px}.projection-row{grid-template-columns:1fr}.projection-item{border-right:0;border-bottom:1px solid var(--line-soft)}}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">Fin<span>Track</span></div>
    <nav id="nav" aria-label="Navegação principal">
      <button class="nav-item" data-view="home" aria-label="Abrir visão geral">Home</button>
      <button class="nav-item" data-view="lancamentos">Lançamentos</button>
      <button class="nav-item" data-view="vencimentos">Vencimentos</button>
      <button class="nav-item" data-view="balanco">Balanço</button>
      <button class="nav-item" data-view="planejamento">Planejamento</button>
      <button class="nav-item" data-view="metas">Metas</button>
      <button class="nav-item" data-view="cadastro">Cadastro</button>
    </nav>
    <div class="sidebar-foot">FinTrack &middot; base pessoal</div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>

<script src="js/financial-core.js"></script>
<script src="js/storage.js"></script>
<script src="js/view-registry.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/ui/events.js"></script>
<script src="js/ui/navigation.js"></script>
<script src="js/ui/filters.js"></script>
<script src="js/ui/screen-events.js"></script>
<script src="js/forms/registry.js"></script>
<script src="js/forms/legacy-adapter.js"></script>
<script src="js/forms/goals.js"></script>
<script src="js/forms/cards.js"></script>
<script src="js/forms/debts.js"></script>
<script src="js/forms/catalog.js"></script>
<script src="js/forms/transactions.js"></script>
<script src="js/forms/entry.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/lancamentos.js"></script>
<script src="js/views/vencimentos.js"></script>
<script src="js/views/balanco.js"></script>
<script src="js/views/planejamento.js"></script>
<script src="js/views/metas.js"></script>
<script src="js/views/cadastro.js"></script>
<script>
/* ---------------------------------------------------------
   FinTrack — base funcional (Vanilla JS, sem backend)
   Estado persistido via window.storage (dado pessoal, não compartilhado)
--------------------------------------------------------- */

const STORAGE_KEY = 'fintrack-data-v1';
const BACKUPS_KEY = 'fintrack-backups-v1';
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const DEFAULT_DATA = {
  usuario: { nome: 'Vitoria' },
  categorias: [
    { id: 'cat-mercado', nome: '🛒 Mercado', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 450 },
    { id: 'cat-necessidades', nome: '⚠️ Necessidades', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 50 },
    { id: 'cat-eletronicos', nome: '📱 Eletrônicos', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 110 },
    { id: 'cat-assinaturas', nome: '📺 Assinaturas', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 40 },
    { id: 'cat-roupas', nome: '👚 Roupas', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-beleza', nome: '💅 Beleza', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-presente', nome: '🎁 Presente', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-saude', nome: '💊 Saúde', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 0 },
    { id: 'cat-outros', nome: '🤷 Outros', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 0 },
    { id: 'cat-desenvolvimento', nome: '🧠 Desenvolvimento', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 0 },
    { id: 'cat-transporte', nome: '🚗 Transporte', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 50 },
    { id: 'cat-comidafora', nome: '🍽️ Comida fora', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-lazer', nome: '🏖️ Lazer', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-moradia', nome: '🏠 Moradia', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 100 },
    { id: 'cat-contas', nome: '🧾 Contas', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 450 },
    { id: 'cat-investimento', nome: '📈 Investimento', tipo: 'Saída', tipoGasto: '-', orcado: 600, natureza: 'movimentacao' },
    { id: 'cat-educacao', nome: '🎓 Educação', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 0 },
    { id: 'cat-divida', nome: '🤝 Dívida', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 290 },
    { id: 'cat-negocio', nome: '💼 Negócio', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-receita', nome: '💸 Receita', tipo: 'Entrada', tipoGasto: '-', orcado: 2000 },
    { id: 'cat-fatura', nome: '🧾 Fatura do Cartão', tipo: 'Saída', tipoGasto: '-', orcado: 0 },
    { id: 'cat-transferencia', nome: '🔁 Transferência', tipo: 'Saída', tipoGasto: '-', orcado: 0, natureza: 'movimentacao' },
  ],
  contas: [
    { id: 'conta-inter', nome: 'Inter', saldoInicial: 30, dataSaldoInicial: '2025-03-25' },
    { id: 'conta-beflex', nome: 'BeFlex', saldoInicial: 4.65, dataSaldoInicial: '2025-03-28' },
    { id: 'conta-bb', nome: 'BB', saldoInicial: 0, dataSaldoInicial: '2025-03-28' },
  ],
  lancamentos: [],
};

let state = null;
let currentView = 'home';
let lancFiltro = { mes: new Date().getMonth() + 1, ano: new Date().getFullYear(), categoriaId: 'todas', busca: '' };
let balancoAno = new Date().getFullYear();
let cadastroTab = 'categorias';
let lancMostrarTodos = false;

/* ---------- Persistência ---------- */

async function loadData(){
  try{
    state = normalizeData(await FinTrackStorage.get(STORAGE_KEY));
    state._backups=await FinTrackStorage.load(BACKUPS_KEY,[]);
  }catch(e){
    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    await saveData();
  }
}

function todayLocal(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function esc(value){ return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function toCents(value){ return Math.round(Number(value || 0) * 100); }
function fromCents(value){ return Number(value || 0) / 100; }
function normalizeData(data){
  return window.FinTrackCore.normalizeData(data, DEFAULT_DATA);
}

async function saveData(){
  try{
    await FinTrackStorage.set(STORAGE_KEY,state);
  }catch(e){
    console.error('Falha ao salvar dados', e);
  }
}

function snapshotAtual(){ const s=JSON.parse(JSON.stringify(state)); delete s._backups; delete s.restauracaoDemo; return s; }
async function registrarBackup(motivo){
  const item={id:uid('backup'),criadoEm:new Date().toISOString(),motivo,registros:state.lancamentos.length,dados:snapshotAtual()};
  const backups=[...(state._backups||[]),item].slice(-5); state._backups=backups;
  try{ await FinTrackStorage.set(BACKUPS_KEY,backups); }catch(e){ console.error('Falha ao salvar backup versionado',e); }
}
function validarBackup(data){
  const erros=[]; if(!data||typeof data!=='object') return ['Arquivo não contém um objeto válido.'];
  if(!data.__centsVersion) erros.push('Versão antiga: valores serão convertidos automaticamente.');
  for(const chave of ['categorias','contas','lancamentos']) if(!Array.isArray(data[chave])) erros.push(`Campo obrigatório ausente: ${chave}.`);
  if(!Array.isArray(data.categorias)||!Array.isArray(data.contas)||!Array.isArray(data.lancamentos)) return erros;
  const ids=(arr,nome)=>{const seen=new Set();arr.forEach((x,i)=>{if(!x.id) erros.push(`${nome}[${i+1}] sem ID.`);else if(seen.has(x.id)) erros.push(`ID duplicado em ${nome}: ${x.id}.`);seen.add(x.id);});};
  ids(data.categorias,'categorias'); ids(data.contas,'contas'); ids(data.lancamentos,'lancamentos');
  const cats=new Set(data.categorias.map(x=>x.id)),contas=new Set(data.contas.map(x=>x.id));
  data.contas.forEach((c,i)=>{if(!c.nome) erros.push(`Conta ${i+1} sem nome.`);if(c.saldoInicial!=null&&!Number.isFinite(Number(c.saldoInicial))) erros.push(`Saldo inválido na conta ${i+1}.`);});
  data.categorias.forEach((c,i)=>{if(!c.nome) erros.push(`Categoria ${i+1} sem nome.`);});
  data.lancamentos.forEach((l,i)=>{if(!l.data||!/^(\\d{4})-(\\d{2})-(\\d{2})$/.test(l.data)) erros.push(`Data inválida no lançamento ${i+1}.`);if(!contas.has(l.contaId)) erros.push(`Conta ausente no lançamento ${i+1}.`);if(l.categoriaId&&!cats.has(l.categoriaId)) erros.push(`Categoria ausente no lançamento ${i+1}.`);if(!Number.isFinite(Number(l.valor))) erros.push(`Valor inválido no lançamento ${i+1}.`);});
  return erros;
}

/* ---------- Helpers ---------- */

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2, 10); }

function formatMoney(v){
  return fromCents(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function catById(id){ return window.FinTrackCore.category(state,id); }
function contaById(id){ return window.FinTrackCore.account(state,id); }
function naturezaLancamento(l){ return window.FinTrackCore.nature(state,l); }
function totalPorNatureza(mes,ano,natureza){ return window.FinTrackCore.totalByNature(state,mes,ano,natureza,todayLocal()); }

function lancamentosDoMes(mes, ano){
  return window.FinTrackCore.monthEntries(state,mes,ano,todayLocal());
}

function totaisDoMes(mes, ano){
  return window.FinTrackCore.totals(state,mes,ano,todayLocal());
}

function gastoPorCategoria(categoriaId, mes, ano){
  return window.FinTrackCore.categorySpend(state,categoriaId,mes,ano,todayLocal());
}

function saldoAtualConta(conta){
  return window.FinTrackCore.accountBalance(state,conta,todayLocal());
}

function addMonths(isoDate, n){
  const [y,m,d] = isoDate.split('-').map(Number);
  const base = new Date(y, (m - 1) + n, 1);
  const lastDay = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  const day = Math.min(d, lastDay);
  return `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function addInterval(isoDate,n,frequencia){
  if(frequencia==='semanal') return addDays(isoDate,n*7);
  if(frequencia==='anual'){ const [y,m,d]=isoDate.split('-').map(Number); return `${y+n}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  return addMonths(isoDate,n);
}

function lancamentosEmUso(tipo, id){
  return tipo === 'categoria'
    ? state.lancamentos.filter(l => l.categoriaId === id).length
    : state.lancamentos.filter(l => l.contaId === id).length;
}

function itensDaSerie(serieId){ return serieId ? state.lancamentos.filter(l=>l.serieId===serieId) : []; }
function serieEstaAtiva(lanc){
  if(!lanc?.serieId) return true;
  const serie=state.series.find(s=>s.id===lanc.serieId);
  return (serie?.status || lanc.serieStatus || 'ativa') === 'ativa';
}
function serieLabel(lanc){
  if(!lanc?.serieId) return '';
  const itens=itensDaSerie(lanc.serieId);
  const serie=lanc.serieTipo==='parcelamento' ? `Parcela ${lanc.parcelaAtual||1}/${lanc.totalParcelas||itens.length}` : 'Recorrente';
  const status=(state.series.find(s=>s.id===lanc.serieId)?.status || lanc.serieStatus)==='pausada' ? ' · pausada' : '';
  return `<span style="color:var(--muted);font-size:12px;">(${serie}${status})</span>`;
}
function registrarHistorico(acao, descricao, detalhes={}){
  state.historico.push({id:uid('hist'),acao,data:todayLocal(),descricao,detalhes});
}
function chaveMes(iso){ return iso ? iso.slice(0,7) : mesAtualKey(); }
function mesFechado(iso){ return Boolean(state.fechamentos?.[chaveMes(iso)]); }
function impedirAlteracaoMes(iso){
  if(!mesFechado(iso)) return false;
  infoModal('Mês fechado','Este mês já foi fechado. Reabra ou altere o fechamento antes de modificar lançamentos desse período.');
  return true;
}
async function alternarSerie(serieId){
  const itens=itensDaSerie(serieId); if(!itens.length) return;
  const atual=state.series.find(s=>s.id===serieId);
  const status=(atual?.status || itens[0].serieStatus || 'ativa')==='ativa' ? 'pausada' : 'ativa';
  if(atual) atual.status=status; else state.series.push({id:serieId,tipo:itens[0].serieTipo||'serie',status});
  itens.forEach(l=>l.serieStatus=status);
  state.historico.push({id:uid('hist'),acao:status==='ativa'?'retomada_serie':'pausa_serie',data:todayLocal(),descricao:`Série ${serieId} ${status}`});
  await saveData(); render();
}

function calcularSaudeFinanceira(mes,ano){
  const t=totaisDoMes(mes,ano), pendentes=state.lancamentos.filter(l=>l.status==='Pendente'&&serieEstaAtiva(l)&&naturezaLancamento(l)==='despesa');
  const vencidos=pendentes.filter(l=>(l.dataVencimento||l.data)<todayLocal()).length;
  const estouradas=state.categorias.filter(c=>c.tipo==='Saída'&&c.orcado>0&&gastoPorCategoria(c.id,mes,ano)>c.orcado).length;
  let pontos=100, fatores=[];
  if(t.saldo<0){pontos-=25;fatores.push('resultado mensal negativo');}
  if(vencidos){pontos-=Math.min(25,vencidos*8);fatores.push(`${vencidos} vencimento(s) atrasado(s)`);}
  if(estouradas){pontos-=Math.min(20,estouradas*5);fatores.push(`${estouradas} categoria(s) acima do orçamento`);}
  if(t.receitas>0 && t.despesas/t.receitas>.7){pontos-=15;fatores.push('alto comprometimento da renda');}
  const invest=totalPorNatureza(mes,ano,'investimento');
  if(invest>0){pontos=Math.min(100,pontos+5);fatores.push('houve investimento no mês');}
  return {pontos:Math.max(0,Math.min(100,pontos)),fatores};
}
function gerarRecomendacoes(mes,ano){
  const t=totaisDoMes(mes,ano), pendentes=state.lancamentos.filter(l=>l.status==='Pendente'&&serieEstaAtiva(l)&&naturezaLancamento(l)==='despesa');
  const vencidos=pendentes.filter(l=>(l.dataVencimento||l.data)<todayLocal());
  const estourada=state.categorias.find(c=>c.tipo==='Saída'&&c.orcado>0&&gastoPorCategoria(c.id,mes,ano)>c.orcado);
  const recomendacoes=[];
  if(vencidos.length) recomendacoes.push({prioridade:'Alta',texto:`Priorize ${vencidos.length} vencimento(s) atrasado(s), totalizando ${formatMoney(vencidos.reduce((s,l)=>s+Number(l.valor),0))}.`});
  if(t.saldo<0) recomendacoes.push({prioridade:'Alta',texto:'O resultado do mês está negativo. Revise despesas pendentes antes de assumir novos compromissos.'});
  if(estourada) recomendacoes.push({prioridade:'Média',texto:`A categoria ${estourada.nome} ultrapassou o orçamento. Revise os lançamentos ou ajuste o planejamento.`});
  if(!recomendacoes.length) recomendacoes.push({prioridade:'Baixa',texto:'Mantenha os lançamentos atualizados e preserve uma margem para os próximos vencimentos.'});
  return recomendacoes;
}

function anosDisponiveis(){
  const anos = new Set(state.lancamentos.map(l => Number(l.data.slice(0,4))));

  return [...anos].sort();

function legacyRenderBalancoView(){
  const receitasPorMes = [], despesasPorMes = [], investimentosPorMes = [], transferenciasPorMes = [], saldoPorMes = [];
  for(let m=1;m<=12;m++){
    const t = totaisDoMes(m, balancoAno);
    receitasPorMes.push(t.receitas); despesasPorMes.push(t.despesas);
    investimentosPorMes.push(totalPorNatureza(m,balancoAno,'investimento'));
    transferenciasPorMes.push(totalPorNatureza(m,balancoAno,'transferencia'));
    saldoPorMes.push(t.saldo);
  }

function renderBarChart(receitas, despesas){
  const w = 760, h = 190, padB = 20, padT = 8;
  const max = Math.max(1, ...receitas, ...despesas);
  const groupW = w / 12;
  const barW = groupW / 2 - 5;
  let bars = '';
  for(let i=0;i<12;i++){
    const xGroup = i * groupW;
    const hIncome = (receitas[i] / max) * (h - padT - padB);
    const hExpense = (despesas[i] / max) * (h - padT - padB);
    const yIncome = h - padB - hIncome;
    const yExpense = h - padB - hExpense;
    bars += `<rect x="${xGroup + 2}" y="${yIncome}" width="${barW}" height="${hIncome}" fill="var(--income)" rx="1"></rect>`;
    bars += `<rect x="${xGroup + barW + 7}" y="${yExpense}" width="${barW}" height="${hExpense}" fill="var(--expense)" rx="1"></rect>`;
    bars += `<text x="${xGroup + groupW/2}" y="${h - 4}" font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">${MESES[i]}</text>`;
  }
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
      <line x1="0" y1="${h-padB}" x2="${w}" y2="${h-padB}" stroke="var(--line)" stroke-width="1"></line>
      ${bars}
    </svg>
    <div style="display:flex;gap:16px;font-size:12px;color:var(--muted);padding:4px 2px 0;">
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--income);border-radius:2px;margin-right:5px;"></span>Receitas</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--expense);border-radius:2px;margin-right:5px;"></span>Despesas</span>
    </div>
  `;
}

  `;

function baixarArquivo(nome, conteudo, tipo){
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportarJSON(){
  const dataStr = JSON.stringify(state, null, 2);
  baixarArquivo(`fintrack-backup-${todayLocal()}.json`, dataStr, 'application/json');
}

function exportarCSV(){
  const header = ['Data','Data Vencimento','Descricao','Tipo','Conta','Categoria','Valor','Status','Fixa'];
  const linhas = state.lancamentos.map(l => [
    l.data, l.dataVencimento || '', l.descricao.replace(/"/g,'""'), l.tipo,
    contaById(l.contaId)?.nome || '', catById(l.categoriaId)?.nome || '',
    fromCents(l.valor).toFixed(2).replace('.',','), l.status, l.fixa ? 'Sim' : 'Não'
  ].map(v => `"${v}"`).join(';'));
  const csv = [header.join(';'), ...linhas].join('\n');
  baixarArquivo(`fintrack-lancamentos-${todayLocal()}.csv`, csv, 'text/csv;charset=utf-8');
}

function importarJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const status=document.getElementById('backup-status');
  const reader=new FileReader();
  reader.onload=async()=>{ try{
    const raw=JSON.parse(reader.result); const erros=validarBackup(raw); const fatais=erros.filter(x=>!x.startsWith('Versão antiga'));
    if(fatais.length){ status.textContent=`Backup rejeitado: ${fatais.slice(0,3).join(' ')}`; return; }
    const imported=normalizeData(raw); const resumo=`Backup válido: ${imported.lancamentos.length} lançamento(s), ${imported.contas.length} conta(s) e ${imported.categorias.length} categoria(s).`;
    if(confirm(`${resumo}\n\nOs dados atuais serão salvos como uma versão antes da importação. Continuar?`)){ await registrarBackup('Antes da importação'); state=imported; state._backups=state._backups||[]; await saveData(); status.textContent='Backup importado com sucesso.'; render(); }
  }catch(err){ status.textContent='Arquivo inválido. Selecione um backup JSON do FinTrack.'; } };
  reader.readAsText(file);
}

function criarDadosDemo(){
  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));
  base.usuario = { nome: state?.usuario?.nome || 'Vitoria' };
  base.lancamentos = [];
  const hoje=todayLocal();
  const primeiro=hoje.slice(0,8)+'01';
  const add=(offset,dia,descricao,tipo,contaId,categoriaId,valor,status='Pago',vencimento)=>{
    const mes=addMonths(primeiro,offset).slice(0,8);
    base.lancamentos.push({id:uid('demo'),tipo,data:mes+String(dia).padStart(2,'0'),dataVencimento:vencimento?mes+String(vencimento).padStart(2,'0'):undefined,descricao,contaId,categoriaId,valor,status,fixa:false});
  };
  [-2,-1,0].forEach((offset,i)=>{
    add(offset,5,'Salário','Receita','conta-bb','cat-receita',2000);
    add(offset,7,'Aluguel','Despesa','conta-inter','cat-moradia',650);
    add(offset,10,'Compras do mês','Despesa','conta-inter','cat-mercado',390+i*45);
    add(offset,12,'Assinaturas','Despesa','conta-inter','cat-assinaturas',39.90);
    add(offset,15,'Aporte mensal','Despesa','conta-bb','cat-investimento',250+i*50);
    add(offset,18,'Transferência entre contas','Despesa','conta-bb','cat-transferencia',180);
    add(offset,22,'Transporte','Despesa','conta-inter','cat-transporte',85+i*10);
  });
  add(0,25,'Conta de energia','Despesa','conta-inter','cat-contas',145,'Pendente',25);
  add(-1,28,'Internet residencial','Despesa','conta-inter','cat-contas',99.90,'Pendente',28);
  return normalizeData(base);
}

function apagarDemo(){
  const quantidade=state.lancamentos.filter(l=>String(l.id).startsWith('demo-')).length;

  confirmAction(`Apagar ${quantidade} lançamento(s) da demonstração? Seus lançamentos reais serão preservados.`, async () => {
    state.lancamentos=state.lancamentos.filter(l=>!String(l.id).startsWith('demo-'));

function restaurarDadosAnteriores(){
  if(!state.restauracaoDemo) return;
  confirmAction('Restaurar os dados salvos antes da demonstração?', async()=>{const backups=state._backups||[];state=normalizeData(state.restauracaoDemo);state._backups=backups;await saveData();render();},'Restaurar dados');
}
function restaurarBackup(index){
  const b=(state._backups||[])[index]; if(!b) return;
  if(confirm(`Restaurar a versão de ${new Date(b.criadoEm).toLocaleString('pt-BR')} com ${b.registros} registro(s)? Os dados atuais serão salvos antes da substituição.`)){
    registrarBackup('Antes da restauração').then(async()=>{const backups=state._backups||[];state=normalizeData(b.dados);state._backups=backups;await saveData();render();});
  }
}

  if(btnNovo) btnNovo.onclick = () => FinTrackFormLayer.open('lancamento',null);
  const btnTransferencia = document.getElementById('btn-nova-transferencia');
  if(btnTransferencia) btnTransferencia.onclick = () => FinTrackFormLayer.open('transferencia');
  const btnInvestimento = document.getElementById('btn-novo-investimento');
  if(btnInvestimento) btnInvestimento.onclick = () => FinTrackFormLayer.open('investimento');

  main.querySelectorAll('[data-action="edit-lanc"]').forEach(b => b.onclick = () => {
    let lanc = state.lancamentos.find(l => l.id === b.dataset.id);
    if(impedirAlteracaoMes(lanc?.data)) return;
    if(lanc?.tipoOperacao==='transferencia'){
      lanc=state.lancamentos.find(l=>l.operacaoId===lanc.operacaoId && l.movimentoTransferencia==='saida') || lanc;
      FinTrackFormLayer.open('transferencia',lanc);
      return;
    }
    const serie=state.lancamentos.filter(x=>x.serieId && x.serieId===lanc?.serieId);
    if(serie.length>1) lanc._editarSerie=confirm('Este lançamento faz parte de uma série. OK edita toda a série; Cancelar edita somente este item.');
    FinTrackFormLayer.open('lancamento',lanc);
  });
  main.querySelectorAll('[data-action="del-lanc"]').forEach(b => b.onclick = () => {
    const lanc=state.lancamentos.find(l=>l.id===b.dataset.id);
    if(impedirAlteracaoMes(lanc?.data)) return;
    const linked=lanc?.tipoOperacao==='transferencia' && lanc.operacaoId
      ? state.lancamentos.filter(l=>l.operacaoId===lanc.operacaoId)
      : state.lancamentos.filter(l=>l.serieId && l.serieId===lanc?.serieId);
    let modo='item';
    if(lanc?.tipoOperacao==='transferencia' && linked.length>1){
      if(!confirm('Esta transferência possui duas movimentações vinculadas. Mover as duas para a lixeira?')) return;
      modo='serie';
    }else if(linked.length>1){
      if(lanc.serieTipo==='recorrencia'){
        const escolha=prompt('Esta recorrência possui '+linked.length+' ocorrências. Digite 1 para excluir toda a série, 2 para excluir esta e as próximas ocorrências, ou 3 para excluir somente esta:','2');
        modo=escolha==='1'?'serie':escolha==='2'?'futuro':'item';
      }else{
        modo=confirm(`Este lançamento faz parte de uma série com ${linked.length} itens. Clique em OK para excluir toda a série ou em Cancelar para excluir somente este item.`)?'serie':'item';
      }
    }
    const alvo=modo==='serie' ? linked : modo==='futuro' ? linked.filter(l=>l.data>=lanc.data) : [lanc];
    confirmAction(modo==='serie' ? 'Mover toda a série para a lixeira?' : modo==='futuro' ? 'Mover esta e as próximas ocorrências para a lixeira?' : 'Mover este lançamento para a lixeira?', async () => {
      const ids=new Set(alvo.map(l=>l.id));
      const removidos=state.lancamentos.filter(l=>ids.has(l.id));
      state.lixeira.push(...removidos.map(l=>({...l,excluidoEm:new Date().toISOString()})));
      state.lancamentos = state.lancamentos.filter(l => !ids.has(l.id));
      state.historico.push({id:uid('hist'),acao:'exclusao',data:todayLocal(),descricao:`${removidos.length} lançamento(s) movido(s) para a lixeira`});
      await saveData();
      render();
    });
  });
  main.querySelectorAll('[data-action="toggle-serie"]').forEach(b => b.onclick = () => alternarSerie(b.dataset.id));
  main.querySelectorAll('[data-action="toggle-status"]').forEach(b => b.onclick = async () => {
    const lanc = state.lancamentos.find(l => l.id === b.dataset.id);
    if(impedirAlteracaoMes(lanc?.data)) return;
    const novoStatus=lanc.status === 'Pago' ? 'Pendente' : 'Pago';
    if(lanc.tipoOperacao==='transferencia' && lanc.operacaoId) state.lancamentos.filter(l=>l.operacaoId===lanc.operacaoId).forEach(l=>l.status=novoStatus);
    else lanc.status=novoStatus;
    registrarHistorico('alteracao_status',`Status alterado para ${novoStatus}: ${lanc.descricao}`,{lancamentoId:lanc.id});
    await saveData();
    render();
  });

  FinTrackFilters.bind(main);

  const btnNovaCat = document.getElementById('btn-nova-categoria');
  if(btnNovaCat) btnNovaCat.onclick = () => FinTrackFormLayer.open('categoria',null);
  main.querySelectorAll('[data-action="edit-cat"]').forEach(b => b.onclick = () => FinTrackFormLayer.open('categoria',catById(b.dataset.id)));
  main.querySelectorAll('[data-action="del-cat"]').forEach(b => b.onclick = () => {
    const emUso = lancamentosEmUso('categoria', b.dataset.id);
    if(emUso > 0){
      infoModal('Não é possível excluir', `Esta categoria está sendo usada em ${emUso} lançamento${emUso > 1 ? 's' : ''}. Edite ou exclua esses lançamentos primeiro.`);
      return;
    }
    confirmAction('Excluir esta categoria?', async () => {
      state.categorias = state.categorias.filter(c => c.id !== b.dataset.id);
      await saveData();
      render();
    });
  });

  const btnNovaConta = document.getElementById('btn-nova-conta');
  if(btnNovaConta) btnNovaConta.onclick = () => FinTrackFormLayer.open('conta',null);
  main.querySelectorAll('[data-action="edit-conta"]').forEach(b => b.onclick = () => FinTrackFormLayer.open('conta',contaById(b.dataset.id)));
  main.querySelectorAll('[data-action="del-conta"]').forEach(b => b.onclick = () => {
    const emUso = lancamentosEmUso('conta', b.dataset.id);
    if(emUso > 0){
      infoModal('Não é possível excluir', `Esta conta está sendo usada em ${emUso} lançamento${emUso > 1 ? 's' : ''}. Edite ou exclua esses lançamentos primeiro.`);
      return;
    }
    confirmAction('Excluir esta conta?', async () => {
      state.contas = state.contas.filter(c => c.id !== b.dataset.id);
      await saveData();
      render();
    });
  });

  const btnExportJson = document.getElementById('btn-export-json');
  if(btnExportJson) btnExportJson.onclick = exportarJSON;
  const btnExportCsv = document.getElementById('btn-export-csv');
  if(btnExportCsv) btnExportCsv.onclick = exportarCSV;

  const btnDemo=document.getElementById('btn-carregar-demo');

  const btnApagarDemo=document.getElementById('btn-apagar-demo');
  if(btnApagarDemo) btnApagarDemo.onclick=apagarDemo;
  const btnDesfazer=document.getElementById('btn-desfazer-exclusao');
  if(btnDesfazer) btnDesfazer.onclick=async()=>{const item=state.lixeira.pop();if(item){delete item.excluidoEm;state.lancamentos.push(item);await saveData();render();}};
  const btnRestaurarDemo=document.getElementById('btn-restaurar-demo');
  if(btnRestaurarDemo) btnRestaurarDemo.onclick=restaurarDadosAnteriores;

  const fechar=document.getElementById('btn-fechar-mes'); if(fechar) fechar.onclick=fecharMes;
  const novaMetaBtn=document.getElementById('btn-nova-meta'); if(novaMetaBtn) novaMetaBtn.onclick=()=>FinTrackFormLayer.open('meta');
}

    <div class="modal-actions"><button class="btn btn-ghost" id="tr-cancel">Cancelar</button><button class="btn btn-primary" id="tr-save">${transf?'Salvar alterações':'Salvar transferência'}</button></div>
  `,()=>{
    document.getElementById('tr-cancel').onclick=closeModal;
    document.getElementById('tr-save').onclick=async()=>{
      const erro=document.getElementById('tr-error'); const origem=document.getElementById('tr-origem').value; const destino=document.getElementById('tr-destino').value; const valor=Number(document.getElementById('tr-valor').value);
      if(impedirAlteracaoMes(document.getElementById('tr-data').value)) return;
      if(origem===destino){erro.textContent='A conta de origem e a conta de destino precisam ser diferentes.';return;}
      if(!Number.isFinite(valor)||valor<=0){erro.textContent='Informe um valor maior que zero.';return;}
      const operacaoId=transf?.operacaoId || uid('op-transferencia');
      const base={operacaoId,tipoOperacao:'transferencia',natureza:'transferencia',data:document.getElementById('tr-data').value,descricao:document.getElementById('tr-descricao').value.trim()||'Transferência entre contas',valor:toCents(valor),status:document.getElementById('tr-status').value,fixa:false};
      const movimentos=[
        {...base,id:transf?.id||uid('transf'),tipo:'Despesa',movimentoTransferencia:'saida',contaId:origem,contaDestinoId:destino},
        {...base,id:transf?.id ? (state.lancamentos.find(l=>l.operacaoId===transf.operacaoId&&l.movimentoTransferencia==='entrada')?.id||uid('transf')) : uid('transf'),tipo:'Receita',movimentoTransferencia:'entrada',contaId:destino,contaOrigemId:origem,contaDestinoId:undefined}
      ];
      state.lancamentos=state.lancamentos.filter(l=>l.operacaoId!==operacaoId);
      state.lancamentos.push(...movimentos);
      registrarHistorico(transf?'edicao_transferencia':'criacao_transferencia',`${transf?'Transferência editada':'Transferência criada'}: ${base.descricao}`,{operacaoId,valor:base.valor});
      await saveData(); closeModal(); render();
    };
  });
}

function legacyOpenInvestimentoForm(){
  if(state.contas.length === 0){ infoModal('Cadastre uma conta primeiro','Um investimento precisa sair ou retornar para uma conta cadastrada.'); return; }
  openModal('Novo investimento', `
    <div class="form-row"><div class="field"><label for="inv-tipo">Movimento</label><select id="inv-tipo"><option value="aporte">Aporte</option><option value="resgate">Resgate</option></select></div><div class="field"><label for="inv-status">Status</label><select id="inv-status"><option>Pago</option><option>Pendente</option></select></div></div>
    <div class="form-row"><div class="field"><label for="inv-data">Data</label><input type="date" id="inv-data" value="${todayLocal()}"></div><div class="field"><label for="inv-conta">Conta</label><select id="inv-conta">${state.contas.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div></div>
    <div class="form-row"><div class="field"><label for="inv-ativo">Tipo do ativo</label><input id="inv-ativo" placeholder="Ex: Tesouro, CDB, ETF" maxlength="60"></div><div class="field"><label for="inv-instituicao">Instituição</label><input id="inv-instituicao" placeholder="Ex: Banco ou corretora" maxlength="80"></div></div>
    <div class="field"><label for="inv-descricao">Descrição</label><input id="inv-descricao" placeholder="Ex: Aporte mensal"></div>
    <div class="field"><label for="inv-valor">Valor</label><input type="number" id="inv-valor" min="0.01" step="0.01"></div><div class="form-error" id="inv-error" role="alert"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="inv-cancel">Cancelar</button><button class="btn btn-primary" id="inv-save">Salvar investimento</button></div>
  `,()=>{
    document.getElementById('inv-cancel').onclick=closeModal;
    document.getElementById('inv-save').onclick=async()=>{
      const erro=document.getElementById('inv-error'), valor=Number(document.getElementById('inv-valor').value), ativo=document.getElementById('inv-ativo').value.trim(), instituicao=document.getElementById('inv-instituicao').value.trim();
      if(impedirAlteracaoMes(document.getElementById('inv-data').value)) return;
      if(!Number.isFinite(valor)||valor<=0){erro.textContent='Informe um valor maior que zero.';return;}
      if(!ativo){erro.textContent='Informe o tipo do ativo.';return;}
      const movimento=document.getElementById('inv-tipo').value;
      const categoria=state.categorias.find(c=>c.id==='cat-investimento') || state.categorias.find(c=>String(c.nome||'').toLowerCase().includes('investimento'));
      state.lancamentos.push({id:uid('investimento'),operacaoId:uid('op-investimento'),tipoOperacao:'investimento',natureza:'investimento',movimentoInvestimento:movimento,tipo:'Despesa',data:document.getElementById('inv-data').value,descricao:document.getElementById('inv-descricao').value.trim() || `${movimento==='aporte'?'Aporte':'Resgate'} · ${ativo}`,contaId:document.getElementById('inv-conta').value,categoriaId:categoria?.id,valor:toCents(valor),status:document.getElementById('inv-status').value,ativo,instituicao,fixa:false});
      registrarHistorico('criacao_investimento',`${movimento==='aporte'?'Aporte':'Resgate'} registrado: ${ativo}`,{valor:toCents(valor),instituicao});
      await saveData(); closeModal(); render();
    };
  });
}

function legacyOpenLancamentoFormSimple(lanc){
  if(state.contas.length === 0){
    infoModal('Cadastre uma conta primeiro', 'Você precisa ter pelo menos uma conta cadastrada para lançar uma receita ou despesa. Vá em Cadastro &gt; Contas.');
    return;
  }
  const temCategoriaSaida = state.categorias.some(c => c.tipo === 'Saída');
  const temCategoriaEntrada = state.categorias.some(c => c.tipo === 'Entrada');
  if(!temCategoriaSaida && !temCategoriaEntrada){
    infoModal('Cadastre uma categoria primeiro', 'Você precisa ter pelo menos uma categoria cadastrada para lançar uma receita ou despesa. Vá em Cadastro &gt; Categorias.');
    return;
  }
  legacyRenderLancFormModal(lanc, lanc ? lanc.tipo : 'Despesa');
}

function legacyRenderLancFormModal(lanc, tipoAtual, draft){
  const base = draft || lanc || { data: todayLocal(), status: 'Pendente', fixa: false, repetirMeses: 12 };
  const l = { ...base, tipo: tipoAtual };
  const categoriasFiltradas = state.categorias.filter(c => c.tipo === (tipoAtual === 'Receita' ? 'Entrada' : 'Saída'));
  const semCategoria = categoriasFiltradas.length === 0;

  openModal(lanc ? 'Editar lançamento' : 'Novo lançamento', `
    <div class="form-row">
      <div class="field"><label>Tipo</label>
        <select id="f-tipo">
          <option value="Despesa" ${tipoAtual==='Despesa'?'selected':''}>Despesa</option>
          <option value="Receita" ${tipoAtual==='Receita'?'selected':''}>Receita</option>
        </select>
      </div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="Pendente" ${l.status==='Pendente'?'selected':''}>Pendente</option>
          <option value="Pago" ${l.status==='Pago'?'selected':''}>Pago</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="field"><label>Data do lançamento</label><input type="date" id="f-data" value="${l.data}"></div>
      <div class="field"><label>Data de vencimento (opcional)</label><input type="date" id="f-data-vencimento" value="${l.dataVencimento || ''}"></div>
    </div>
    <div class="field"><label>Descrição</label><input type="text" id="f-descricao" value="${esc(l.descricao)}" placeholder="Ex: Mercado do mês"></div>
    <div class="form-row">
      <div class="field"><label>Conta</label>
        <select id="f-conta">${state.contas.map(c => `<option value="${c.id}" ${l.contaId===c.id?'selected':''}>${c.nome}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Categoria</label>
        <select id="f-categoria" ${semCategoria ? 'disabled' : ''}>
          ${semCategoria ? '<option>Nenhuma categoria deste tipo</option>' : categoriasFiltradas.map(c => `<option value="${c.id}" ${l.categoriaId===c.id?'selected':''}>${c.nome}</option>`).join('')}
        </select>
      </div>
    </div>
    ${tipoAtual==='Despesa' && state.cartoes.length ? `<div class="field"><label>Cartão (opcional)</label><select id="f-cartao"><option value="">Não usar cartão</option>${state.cartoes.map(c=>`<option value="${c.id}" ${l.cartaoId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>` : ''}
    <div class="field"><label>Valor</label><input type="number" step="0.01" min="0" id="f-valor" value="${l.valor ? fromCents(l.valor) : ''}"></div>
    <div class="form-error" id="lanc-error" role="alert"></div>
    ${!lanc ? `<div class="field checkbox-field"><input type="checkbox" id="f-parcelado"><label for="f-parcelado" style="margin:0;">Compra parcelada</label></div><div id="wrap-parcelado" style="display:none;"><div class="form-row"><div class="field"><label>Valor total</label><input type="number" step="0.01" min="0" id="f-total-parcelas"></div><div class="field"><label>Quantidade de parcelas</label><input type="number" min="2" max="60" id="f-qtd-parcelas" value="2"></div></div></div>` : ''}
    ${!lanc ? `<div class="field checkbox-field"><input type="checkbox" id="f-recorrente"><label for="f-recorrente" style="margin:0;">Criar recorrência</label></div><div id="wrap-recorrente" style="display:none;"><div class="form-row"><div class="field"><label>Frequência</label><select id="f-frequencia"><option value="mensal">Mensal</option><option value="semanal">Semanal</option><option value="anual">Anual</option></select></div><div class="field"><label>Repetir por</label><input type="number" id="f-qtd-recorrencia" min="1" max="60" value="12"></div></div><div class="field"><label>Data final (opcional)</label><input type="date" id="f-data-final"></div></div>` : ''}
    ${semCategoria ? `<p style="font-size:12.5px;color:var(--expense);margin:0 0 8px;">Não há categorias de ${tipoAtual === 'Receita' ? 'Entrada' : 'Saída'} cadastradas — cadastre uma em Cadastro &gt; Categorias antes de salvar.</p>` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="lf-cancel">Cancelar</button>
      <button class="btn btn-primary" id="lf-save" ${semCategoria ? 'disabled' : ''}>Salvar</button>
    </div>
  `, () => {
    document.getElementById('f-tipo').onchange = (e) => {
      const draft = {
        data: document.getElementById('f-data').value,
        dataVencimento: document.getElementById('f-data-vencimento').value,
        descricao: document.getElementById('f-descricao').value,
        contaId: document.getElementById('f-conta').value,
        cartaoId: document.getElementById('f-cartao')?.value || null,
        valor: toCents(document.getElementById('f-valor').value),
        status: document.getElementById('f-status').value,
      };
      legacyRenderLancFormModal(lanc, e.target.value, draft);
    };
    document.getElementById('f-parcelado')?.addEventListener('change',e=>document.getElementById('wrap-parcelado').style.display=e.target.checked?'block':'none');
    document.getElementById('f-recorrente')?.addEventListener('change',e=>document.getElementById('wrap-recorrente').style.display=e.target.checked?'block':'none');
    document.getElementById('lf-cancel').onclick = closeModal;
    document.getElementById('lf-save').onclick = async () => {
      const valor = parseFloat(document.getElementById('f-valor').value);
      const descricao = document.getElementById('f-descricao').value.trim();
      const categoriaId = document.getElementById('f-categoria').value;
      const error=document.getElementById('lanc-error');
      if(!descricao){error.textContent='Informe uma descrição.';return;}
      if(isNaN(valor)||valor<=0){error.textContent='Informe um valor maior que zero.';return;}
      if(!document.getElementById('f-data').value){error.textContent='Informe a data do lançamento.';return;}
      if(impedirAlteracaoMes(document.getElementById('f-data').value)) return;
      if(semCategoria){error.textContent='Cadastre uma categoria deste tipo antes de salvar.';return;}
      const parcelado = document.getElementById('f-parcelado')?.checked;
      const recorrente = document.getElementById('f-recorrente')?.checked;
      if(parcelado && recorrente){error.textContent='Escolha parcelamento ou recorrência, não os dois ao mesmo tempo.';return;}
      const totalParcelas=parcelado ? Math.max(2,Math.min(60,parseInt(document.getElementById('f-qtd-parcelas').value)||2)) : 1;
      const recorrenciaQtd=recorrente ? Math.max(1,Math.min(60,parseInt(document.getElementById('f-qtd-recorrencia').value)||1)) : 1;
      const serieId=(parcelado||recorrente)?uid(parcelado?'parcelamento':'recorrencia'):null;
      const payload = {
        id: lanc ? lanc.id : uid('lanc'),
        operacaoId: lanc ? (lanc.operacaoId || null) : null,
        tipoOperacao: lanc?.tipoOperacao || (document.getElementById('f-tipo').value === 'Receita' ? 'receita' : 'despesa'),
        tipo: document.getElementById('f-tipo').value,
        data: document.getElementById('f-data').value,
        dataVencimento: document.getElementById('f-data-vencimento').value || undefined,
        descricao,
        contaId: document.getElementById('f-conta').value,
        categoriaId,
        cartaoId: document.getElementById('f-cartao')?.value || null,
        valor: toCents(valor),
        status: document.getElementById('f-status').value,
        fixa:false,
        serieId: lanc ? lanc.serieId : serieId,
        serieTipo: lanc ? lanc.serieTipo : (parcelado ? 'parcelamento' : recorrente ? 'recorrencia' : undefined),
        serieStatus: (parcelado || recorrente || lanc?.serieId) ? (lanc?.serieStatus || 'ativa') : undefined,
        parcelaAtual: lanc ? lanc.parcelaAtual : (parcelado ? 1 : undefined),
        totalParcelas: lanc ? lanc.totalParcelas : (parcelado ? totalParcelas : undefined),
        frequencia: lanc ? lanc.frequencia : (recorrente ? document.getElementById('f-frequencia').value : undefined),
        dataFinal: lanc ? lanc.dataFinal : (recorrente ? document.getElementById('f-data-final').value || undefined : undefined),
      };
      if(lanc){
        const idx = state.lancamentos.findIndex(x => x.id === lanc.id);
        state.lancamentos[idx] = payload;
        if(lanc._editarSerie && lanc.serieId){
          state.lancamentos=state.lancamentos.map(x => x.serieId===lanc.serieId ? {...x,descricao:payload.descricao,contaId:payload.contaId,categoriaId:payload.categoriaId,status:payload.status,valor:payload.valor,serieStatus:payload.serieStatus} : x);
        }
      }else{
        state.lancamentos.push(payload);
        if(parcelado || recorrente){
          const n = parcelado ? totalParcelas : recorrenciaQtd;
          const totalCentavos=parcelado ? toCents(document.getElementById('f-total-parcelas').value) : payload.valor;
          const baseParcela=parcelado ? Math.floor(totalCentavos/n) : payload.valor;
          for(let k=1;k<n;k++){
            state.lancamentos.push({
              ...payload,
              id: uid('lanc'),
              data: addInterval(payload.data,k,payload.frequencia||'mensal'),
              dataVencimento: payload.dataVencimento ? addInterval(payload.dataVencimento,k,payload.frequencia||'mensal') : undefined,
              valor: parcelado ? baseParcela + (k===n-1 ? totalCentavos-baseParcela*n : 0) : payload.valor,
              parcelaAtual: parcelado ? k+1 : undefined,
              descricao: parcelado ? `${descricao} (${k+1} de ${n})` : descricao,
              status: 'Pendente',
              serieStatus: 'ativa',
            });
          }
        }
      }
      registrarHistorico(lanc?'edicao_lancamento':'criacao_lancamento',`${lanc?'Lançamento editado':'Lançamento criado'}: ${descricao}`,{lancamentoId:payload.id,valor:payload.valor});
      await saveData();
      closeModal();
      lancFiltro.mes = Number(payload.data.slice(5,7));
      lancFiltro.ano = Number(payload.data.slice(0,4));
      render();
    };
  });
}
