<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1C2620;
    --forest: #24402F;
    --forest-dark: #182B20;
    --paper: #F0ECE2;
    --paper-alt: #E8E2D2;
    --card: #FBF9F3;
    --line: #D9D2BF;
    --line-soft: #E5DFCE;
    --income: #4B7A57;
    --expense: #9C4A2E;
    --gold: #B9862F;
    --muted: #766F5E;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:220px;flex-shrink:0;background:var(--forest);color:var(--paper);display:flex;flex-direction:column;padding:28px 0;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:10;}
  .brand{font-family:'Fraunces',serif;font-size:22px;font-weight:600;padding:0 24px 28px;border-bottom:1px solid rgba(240,236,226,0.15);margin-bottom:8px;}
  .brand span{color:var(--gold);}
  nav{display:flex;flex-direction:column;margin-top:8px;}
  .nav-item{all:unset;cursor:pointer;padding:12px 24px;font-size:14px;color:rgba(240,236,226,0.75);border-left:3px solid transparent;transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--paper);}
  .nav-item.active{background:var(--forest-dark);color:var(--paper);border-left:3px solid var(--gold);font-weight:500;}
  .sidebar-foot{margin-top:auto;padding:16px 24px 0;font-size:12px;color:rgba(240,236,226,0.4);border-top:1px solid rgba(240,236,226,0.15);padding-top:14px;}

  /* Main */
  main{flex:1;padding:36px 44px;max-width:1180px;min-width:0;}
  .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;}
  .page-heading{min-width:0;}
  .page-title{font-size:26px;font-weight:600;margin:0 0 4px;line-height:1.2;}
  .page-sub{color:var(--muted);margin:0;font-size:14px;}
  .page-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}

  /* Cards */
  .cards-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:28px;}
  .stat-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:17px 18px;min-width:0;}
  .stat-label{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .stat-value{font-family:'Fraunces',serif;font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;}
  .stat-value.income{color:var(--income);}
  .stat-value.expense{color:var(--expense);}
  .stat-meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35;}
  .alert-list{padding:4px 20px 14px;}
  .alert-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .alert-item:last-child{border-bottom:0;}
  .alert-mark{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:6px;flex:none;}
  .quick-actions{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px;}
  .summary-strip{display:flex;gap:20px;flex-wrap:wrap;padding:12px 20px;background:var(--paper-alt);border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--muted);}
  .summary-strip strong{color:var(--ink);font-family:'Fraunces',serif;font-size:16px;margin-left:4px;}
  .group-title{background:var(--paper-alt);color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;padding:8px 20px;text-transform:uppercase;}
  .insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 20px;}
  .insight-card{border:1px solid var(--line-soft);padding:14px;background:var(--paper);font-size:13.5px;}
  .insight-card strong{display:block;margin-bottom:4px;color:var(--forest);}
  .projection-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line-soft);}
  .projection-item{padding:16px 20px;border-right:1px solid var(--line-soft);}
  .projection-item:last-child{border-right:0;}
  .projection-item span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px;}
  .projection-item strong{font-family:'Fraunces',serif;font-size:20px;}
  .demo-banner{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:18px;background:rgba(185,134,47,.15);border:1px solid rgba(185,134,47,.45);color:var(--forest);font-size:13px;}
  .demo-banner strong{letter-spacing:.05em;font-size:12px;}
  .demo-banner span{flex:1;color:var(--muted);}

  /* Section */
  .section{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
  .section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line-soft);}
  .section-head h2{font-size:16px;margin:0;font-weight:600;}

  /* Tables */
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;padding:10px 20px;border-bottom:1px solid var(--line);}
  td{padding:11px 20px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.money-in,.money-in{color:var(--income);}
  td.money-out,.money-out{color:var(--expense);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{all:unset;cursor:pointer;color:var(--muted);font-size:13px;padding:7px 8px;min-height:36px;border-radius:2px;}
  .icon-btn:hover{background:var(--paper-alt);color:var(--ink);}

  .empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .empty-state strong{display:block;color:var(--ink);font-family:'Fraunces',serif;font-size:16px;margin-bottom:6px;font-weight:500;}

  /* Buttons */
  .btn{font-family:'IBM Plex Sans',sans-serif;border:none;cursor:pointer;padding:9px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:500;}
  .btn-primary{background:var(--forest);color:var(--paper);}
  .btn-primary:hover{background:var(--forest-dark);}
  .btn-ghost{background:transparent;color:var(--forest);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-alt);}
  .btn-danger{background:transparent;color:var(--expense);}
  button:focus-visible,.btn:focus-visible,.tab-btn:focus-visible,.nav-item:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  button:disabled{opacity:.55;cursor:not-allowed;}

  /* Forms */
  .field{margin-bottom:14px;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;color:var(--muted);font-weight:500;}
  .field input, .field select{font-family:'IBM Plex Sans',sans-serif;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:#fff;color:var(--ink);}
  .field input:focus, .field select:focus{outline:2px solid var(--gold);outline-offset:0;}
  .form-row{display:flex;gap:12px;}
  .form-row .field{flex:1;}
  .checkbox-field{flex-direction:row;align-items:center;gap:8px;}
  .checkbox-field input{width:auto;}

  /* Filters */
  .filters{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line-soft);}
  .filters select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;background:#fff;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(24,32,26,0.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--card);border-radius:var(--radius);width:440px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:24px 26px;}
  .modal h3{margin:0 0 18px;font-size:19px;font-weight:600;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .form-error{color:var(--expense);font-size:12.5px;margin:-5px 0 10px;min-height:18px;}
  [aria-live]{min-height:18px;}

  /* Tabs (Cadastro) */
  .tabs{display:flex;gap:4px;margin-bottom:18px;}
  .tab-btn{all:unset;cursor:pointer;padding:8px 16px;font-size:13.5px;border-radius:var(--radius);color:var(--muted);}
  .tab-btn.active{background:var(--forest);color:var(--paper);}

  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:500;}
  .badge-paid{background:rgba(75,122,87,0.15);color:var(--income);}
  .badge-pending{background:rgba(156,74,46,0.13);color:var(--expense);}

  select, input{width:100%;}
  @media (max-width:900px){main{padding:28px 24px}.cards-row{grid-template-columns:repeat(2,minmax(0,1fr))}.projection-row{grid-template-columns:repeat(2,1fr)}.projection-item:nth-child(2){border-right:0}}
  @media (max-width:640px){#app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:16px 0}.brand{padding:0 18px 14px;margin-bottom:0}.sidebar-foot{display:none}nav{display:flex;flex-direction:row;overflow:auto;margin-top:8px}.nav-item{white-space:nowrap;padding:10px 14px;border-left:0;border-bottom:3px solid transparent}.nav-item.active{border-left:0;border-bottom-color:var(--gold)}main{padding:24px 14px}.page-header{display:block;margin-bottom:20px}.page-actions{justify-content:flex-start;margin-top:14px}.cards-row{grid-template-columns:1fr 1fr;gap:10px}.stat-card{padding:14px 12px}.stat-value{font-size:22px}.section-head{padding:13px 14px;flex-wrap:wrap}.section{overflow-x:auto}table{min-width:680px}.filters{flex-wrap:wrap;padding:12px 14px}.filters select,.filters input{min-width:140px;flex:1}.insight-grid{grid-template-columns:1fr;padding:14px}.projection-row{grid-template-columns:1fr}.projection-item{border-right:0;border-bottom:1px solid var(--line-soft)}}
  @media (max-width:480px){main{padding:18px 10px}.page-title{font-size:23px}.cards-row{grid-template-columns:1fr}.stat-card{padding:13px}.btn{width:100%;min-height:42px}.page-actions,.quick-actions{width:100%;flex-direction:column}.page-actions .btn,.quick-actions .btn{width:100%}.form-row{flex-direction:column;gap:0}.modal{padding:20px 16px;max-width:calc(100vw - 20px)}.modal-actions{flex-direction:column-reverse}.modal-actions .btn{width:100%;min-height:42px}.tabs{overflow-x:auto;padding-bottom:4px}.tab-btn{white-space:nowrap;min-height:40px}.filters select,.filters input{min-width:100%}.section-head h2{font-size:15px}.demo-banner{align-items:flex-start;flex-direction:column;gap:6px}.demo-banner .btn{width:100%}}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">Fin<span>Track</span></div>
    <nav id="nav" aria-label="Navegação principal">
      <button class="nav-item" data-view="home" aria-label="Abrir visão geral">Home</button>
      <button class="nav-item" data-view="lancamentos">Lançamentos</button>
      <button class="nav-item" data-view="vencimentos">Vencimentos</button>
      <button class="nav-item" data-view="balanco">Balanço</button>
      <button class="nav-item" data-view="planejamento">Planejamento</button>
      <button class="nav-item" data-view="metas">Metas</button>
      <button class="nav-item" data-view="cadastro">Cadastro</button>
    </nav>
    <div class="sidebar-foot">FinTrack &middot; base pessoal</div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root" aria-live="polite"></div>

<script src="js/core/schema.js"></script>
<script src="js/core/migrations.js"></script>
<script src="js/core/normalize.js"></script>
<script src="js/core/validate.js"></script>
<script src="js/core/state.js"></script>
<script src="js/financial-core.js"></script>
<script src="js/core/closing.js"></script>
<script src="js/services/financial.js"></script>
<script src="js/storage.js"></script>
<script src="js/view-registry.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/ui/events.js"></script>
<script src="js/ui/navigation.js"></script>
<script src="js/ui/filters.js"></script>
<script src="js/ui/screen-events.js"></script>
<script src="js/ui/screen-handlers.js"></script>
<script src="js/forms/registry.js"></script>
<script src="js/forms/legacy-adapter.js"></script>
<script src="js/forms/goals.js"></script>
<script src="js/forms/cards.js"></script>
<script src="js/forms/debts.js"></script>
<script src="js/forms/payments.js"></script>
<script src="js/forms/catalog.js"></script>
<script src="js/forms/transactions.js"></script>
<script src="js/forms/entry.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/lancamentos.js"></script>
<script src="js/views/vencimentos.js"></script>
<script src="js/views/balanco.js"></script>
<script src="js/views/planejamento.js"></script>
<script src="js/views/metas.js"></script>
<script src="js/views/cadastro.js"></script>
<script>
/* ---------------------------------------------------------
   FinTrack — base funcional (Vanilla JS, sem backend)
   Estado persistido via window.storage (dado pessoal, não compartilhado)
--------------------------------------------------------- */

const STORAGE_KEY = 'fintrack-data-v1';
const BACKUPS_KEY = 'fintrack-backups-v1';
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const DEFAULT_DATA = {
  usuario: { nome: 'Vitoria' },
  categorias: [
    { id: 'cat-mercado', nome: '🛒 Mercado', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 450 },
    { id: 'cat-necessidades', nome: '⚠️ Necessidades', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 50 },
    { id: 'cat-eletronicos', nome: '📱 Eletrônicos', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 110 },
    { id: 'cat-assinaturas', nome: '📺 Assinaturas', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 40 },
    { id: 'cat-roupas', nome: '👚 Roupas', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-beleza', nome: '💅 Beleza', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-presente', nome: '🎁 Presente', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-saude', nome: '💊 Saúde', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 0 },
    { id: 'cat-outros', nome: '🤷 Outros', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 0 },
    { id: 'cat-desenvolvimento', nome: '🧠 Desenvolvimento', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 0 },
    { id: 'cat-transporte', nome: '🚗 Transporte', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 50 },
    { id: 'cat-comidafora', nome: '🍽️ Comida fora', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-lazer', nome: '🏖️ Lazer', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-moradia', nome: '🏠 Moradia', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 100 },
    { id: 'cat-contas', nome: '🧾 Contas', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 450 },
    { id: 'cat-investimento', nome: '📈 Investimento', tipo: 'Saída', tipoGasto: '-', orcado: 600, natureza: 'movimentacao' },
    { id: 'cat-educacao', nome: '🎓 Educação', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 0 },
    { id: 'cat-divida', nome: '🤝 Dívida', tipo: 'Saída', tipoGasto: 'Essencial', orcado: 290 },
    { id: 'cat-negocio', nome: '💼 Negócio', tipo: 'Saída', tipoGasto: 'Não Essencial', orcado: 0 },
    { id: 'cat-receita', nome: '💸 Receita', tipo: 'Entrada', tipoGasto: '-', orcado: 2000 },
    { id: 'cat-fatura', nome: '🧾 Fatura do Cartão', tipo: 'Saída', tipoGasto: '-', orcado: 0 },
    { id: 'cat-transferencia', nome: '🔁 Transferência', tipo: 'Saída', tipoGasto: '-', orcado: 0, natureza: 'movimentacao' },
  ],
  contas: [
    { id: 'conta-inter', nome: 'Inter', saldoInicial: 30, dataSaldoInicial: '2025-03-25' },
    { id: 'conta-beflex', nome: 'BeFlex', saldoInicial: 4.65, dataSaldoInicial: '2025-03-28' },
    { id: 'conta-bb', nome: 'BB', saldoInicial: 0, dataSaldoInicial: '2025-03-28' },
  ],
  lancamentos: [],
};

let state = null;
FinTrackState.bind({get:()=>state,set:next=>{state=next;}});
let currentView = 'home';
let lancFiltro = { mes: new Date().getMonth() + 1, ano: new Date().getFullYear(), categoriaId: 'todas', busca: '' };
let balancoAno = new Date().getFullYear();
let cadastroTab = 'categorias';
let lancMostrarTodos = false;

/* ---------- Persistência ---------- */

async function loadData(){
  try{
    state = normalizeData(await FinTrackStorage.get(STORAGE_KEY));
    const report=window.FinTrackValidation.validateData(state);
    if(!report.valid) state=window.FinTrackValidation.repairData(state);
    const backups=await FinTrackStorage.load(BACKUPS_KEY,[]);
    state._backups=Array.isArray(backups)?backups:[];
  }catch(e){
    // O fallback também precisa passar pelo mesmo pipeline de migração e
    // normalização dos dados persistidos. Caso contrário, os valores ficam em
    // reais enquanto o restante da aplicação trabalha em centavos, e várias
    // coleções opcionais permanecem indefinidas.
    state = normalizeData(DEFAULT_DATA);
    await saveData();
  }
}

function todayLocal(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function esc(value){ return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function toCents(value){ return Math.round(Number(value || 0) * 100); }
function fromCents(value){ return Number(value || 0) / 100; }
function normalizeData(data){
  return window.FinTrackCore.normalizeData(data, DEFAULT_DATA);
}

async function saveData(){
  try{
    await FinTrackStorage.set(STORAGE_KEY,state);
  }catch(e){
    console.error('Falha ao salvar dados', e);
  }
}

function snapshotAtual(){ const s=JSON.parse(JSON.stringify(state)); delete s._backups; delete s.restauracaoDemo; delete s.modoDemo; return s; }
async function registrarBackup(motivo){
  const item={id:uid('backup'),criadoEm:new Date().toISOString(),motivo,registros:state.lancamentos.length,dados:snapshotAtual()};
  const backups=[...(state._backups||[]),item].slice(-5); state._backups=backups;
  try{ await FinTrackStorage.set(BACKUPS_KEY,backups); }catch(e){ console.error('Falha ao salvar backup versionado',e); }
}
function validarBackup(data){
  const erros=[]; if(!data||typeof data!=='object') return ['Arquivo não contém um objeto válido.'];
  if(!data.__centsVersion) erros.push('Versão antiga: valores serão convertidos automaticamente.');
  for(const chave of ['categorias','contas','lancamentos']) if(!Array.isArray(data[chave])) erros.push(`Campo obrigatório ausente: ${chave}.`);
  if(!Array.isArray(data.categorias)||!Array.isArray(data.contas)||!Array.isArray(data.lancamentos)) return erros;
  const ids=(arr,nome)=>{const seen=new Set();arr.forEach((x,i)=>{if(!x.id) erros.push(`${nome}[${i+1}] sem ID.`);else if(seen.has(x.id)) erros.push(`ID duplicado em ${nome}: ${x.id}.`);seen.add(x.id);});};
  ids(data.categorias,'categorias'); ids(data.contas,'contas'); ids(data.lancamentos,'lancamentos');
  const cats=new Set(data.categorias.map(x=>x.id)),contas=new Set(data.contas.map(x=>x.id));
  data.contas.forEach((c,i)=>{if(!c.nome) erros.push(`Conta ${i+1} sem nome.`);if(c.saldoInicial!=null&&!Number.isFinite(Number(c.saldoInicial))) erros.push(`Saldo inválido na conta ${i+1}.`);});
  data.categorias.forEach((c,i)=>{if(!c.nome) erros.push(`Categoria ${i+1} sem nome.`);});
  data.lancamentos.forEach((l,i)=>{if(!l.data||!/^(\\d{4})-(\\d{2})-(\\d{2})$/.test(l.data)) erros.push(`Data inválida no lançamento ${i+1}.`);if(!contas.has(l.contaId)) erros.push(`Conta ausente no lançamento ${i+1}.`);if(l.categoriaId&&!cats.has(l.categoriaId)) erros.push(`Categoria ausente no lançamento ${i+1}.`);if(!Number.isFinite(Number(l.valor))) erros.push(`Valor inválido no lançamento ${i+1}.`);});
  return erros;
}

/* ---------- Helpers ---------- */

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2, 10); }

function formatMoney(v){
  return fromCents(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatDate(iso){

function addMonths(isoDate, n){
  const [y,m,d] = isoDate.split('-').map(Number);
  const base = new Date(y, (m - 1) + n, 1);
  const lastDay = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  const day = Math.min(d, lastDay);
  return `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function addInterval(isoDate,n,frequencia){
  if(frequencia==='semanal') return addDays(isoDate,n*7);
  if(frequencia==='anual'){ const [y,m,d]=isoDate.split('-').map(Number); return `${y+n}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  return addMonths(isoDate,n);
}

function itensDaSerie(serieId){ return serieId ? state.lancamentos.filter(l=>l.serieId===serieId) : []; }
function serieEstaAtiva(lanc){
  if(!lanc?.serieId) return true;
  const serie=state.series.find(s=>s.id===lanc.serieId);
  return (serie?.status || lanc.serieStatus || 'ativa') === 'ativa';
}
function serieLabel(lanc){
  if(!lanc?.serieId) return '';
  const itens=itensDaSerie(lanc.serieId);
  const serie=lanc.serieTipo==='parcelamento' ? `Parcela ${lanc.parcelaAtual||1}/${lanc.totalParcelas||itens.length}` : 'Recorrente';
  const status=(state.series.find(s=>s.id===lanc.serieId)?.status || lanc.serieStatus)==='pausada' ? ' · pausada' : '';
  return `<span style="color:var(--muted);font-size:12px;">(${serie}${status})</span>`;
}
function registrarHistorico(acao, descricao, detalhes={}){

function chaveMes(iso){ return iso ? iso.slice(0,7) : mesAtualKey(); }
function mesFechado(iso){ return FinTrackClosing.isClosed(state.fechamentos?.[chaveMes(iso)]); }
function impedirAlteracaoMes(iso){

  infoModal('Mês fechado','Este mês já foi fechado. Reabra ou altere o fechamento antes de modificar lançamentos desse período.');

async function alternarSerie(serieId){
  const itens=itensDaSerie(serieId); if(!itens.length) return;
  const atual=state.series.find(s=>s.id===serieId);
  const status=(atual?.status || itens[0].serieStatus || 'ativa')==='ativa' ? 'pausada' : 'ativa';
  if(atual) atual.status=status; else state.series.push({id:serieId,tipo:itens[0].serieTipo||'serie',status});
  itens.forEach(l=>l.serieStatus=status);
  state.historico.push({id:uid('hist'),acao:status==='ativa'?'retomada_serie':'pausa_serie',data:todayLocal(),descricao:`Série ${serieId} ${status}`});
  await saveData(); render();
}

function calcularSaudeFinanceira(mes,ano){
  const t=totaisDoMes(mes,ano), pendentes=state.lancamentos.filter(l=>l.status==='Pendente'&&serieEstaAtiva(l)&&naturezaLancamento(l)==='despesa');
  const vencidos=pendentes.filter(l=>(l.dataVencimento||l.data)<todayLocal()).length;
  const estouradas=state.categorias.filter(c=>c.tipo==='Saída'&&c.orcado>0&&gastoPorCategoria(c.id,mes,ano)>c.orcado).length;
  const invest=totalPorNatureza(mes,ano,'investimento');
  const componentes=[
    {nome:'Resultado',max:25,pontos:t.saldo>=0?25:0,detalhe:t.saldo>=0?'O mês terminou positivo.':'O resultado mensal está negativo.'},
    {nome:'Pendências',max:20,pontos:Math.max(0,20-Math.min(20,vencidos*6)),detalhe:vencidos?`${vencidos} vencimento(s) atrasado(s).`:'Nenhum vencimento atrasado.'},
    {nome:'Orçamento',max:20,pontos:Math.max(0,20-Math.min(20,estouradas*7)),detalhe:estouradas?`${estouradas} categoria(s) acima do orçamento.`:'Categorias dentro do orçamento.'},
    {nome:'Comprometimento',max:20,pontos:t.receitas>0&&t.despesas/t.receitas>.7?5:20,detalhe:t.receitas>0&&t.despesas/t.receitas>.7?'Despesas acima de 70% das receitas.':'Comprometimento sob controle.'},
    {nome:'Investimentos',max:15,pontos:invest>0?15:8,detalhe:invest>0?'Houve investimento no período.':'Nenhum investimento registrado no período.'},
  ];
  const pontos=componentes.reduce((sum,item)=>sum+item.pontos,0),fatores=componentes.filter(item=>item.pontos<item.max).map(item=>item.detalhe);
  return {pontos,fatores,componentes};
}
function gerarRecomendacoes(mes,ano){
  const t=totaisDoMes(mes,ano), pendentes=state.lancamentos.filter(l=>l.status==='Pendente'&&serieEstaAtiva(l)&&naturezaLancamento(l)==='despesa');
  const vencidos=pendentes.filter(l=>(l.dataVencimento||l.data)<todayLocal());
  const estourada=state.categorias.find(c=>c.tipo==='Saída'&&c.orcado>0&&gastoPorCategoria(c.id,mes,ano)>c.orcado);
  const recomendacoes=[];
  if(vencidos.length) recomendacoes.push({prioridade:'Alta',texto:`Priorize ${vencidos.length} vencimento(s) atrasado(s), totalizando ${formatMoney(vencidos.reduce((s,l)=>s+Number(l.valor),0))}.`});
  if(t.saldo<0) recomendacoes.push({prioridade:'Alta',texto:'O resultado do mês está negativo. Revise despesas pendentes antes de assumir novos compromissos.'});
  if(estourada) recomendacoes.push({prioridade:'Média',texto:`A categoria ${estourada.nome} ultrapassou o orçamento. Revise os lançamentos ou ajuste o planejamento.`});
  if(!recomendacoes.length) recomendacoes.push({prioridade:'Baixa',texto:'Mantenha os lançamentos atualizados e preserve uma margem para os próximos vencimentos.'});
  return recomendacoes;
}

function renderBarChart(receitas, despesas){
  const w = 760, h = 190, padB = 20, padT = 8;
  const max = Math.max(1, ...receitas, ...despesas);
  const groupW = w / 12;
  const barW = groupW / 2 - 5;
  let bars = '';
  for(let i=0;i<12;i++){
    const xGroup = i * groupW;
    const hIncome = (receitas[i] / max) * (h - padT - padB);
    const hExpense = (despesas[i] / max) * (h - padT - padB);
    const yIncome = h - padB - hIncome;
    const yExpense = h - padB - hExpense;
    bars += `<rect x="${xGroup + 2}" y="${yIncome}" width="${barW}" height="${hIncome}" fill="var(--income)" rx="1"></rect>`;
    bars += `<rect x="${xGroup + barW + 7}" y="${yExpense}" width="${barW}" height="${hExpense}" fill="var(--expense)" rx="1"></rect>`;
    bars += `<text x="${xGroup + groupW/2}" y="${h - 4}" font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">${MESES[i]}</text>`;
  }
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
      <line x1="0" y1="${h-padB}" x2="${w}" y2="${h-padB}" stroke="var(--line)" stroke-width="1"></line>
      ${bars}
    </svg>
    <div style="display:flex;gap:16px;font-size:12px;color:var(--muted);padding:4px 2px 0;">
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--income);border-radius:2px;margin-right:5px;"></span>Receitas</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--expense);border-radius:2px;margin-right:5px;"></span>Despesas</span>
    </div>
  `;
}

function baixarArquivo(nome, conteudo, tipo){
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportarJSON(){
  const dataStr = JSON.stringify(state, null, 2);

function exportarCSV(){

  ].map(v => `"${v}"`).join(';'));

}

function importarJSON(e){

  const reader=new FileReader();
  reader.onload=async()=>{ try{
    const raw=JSON.parse(reader.result); const erros=validarBackup(raw); const fatais=erros.filter(x=>!x.startsWith('Versão antiga'));
    if(fatais.length){ status.textContent=`Backup rejeitado: ${fatais.slice(0,3).join(' ')}`; return; }
    const imported=normalizeData(raw); const resumo=`Backup válido: ${imported.lancamentos.length} lançamento(s), ${imported.contas.length} conta(s) e ${imported.categorias.length} categoria(s).`;
    if(confirm(`${resumo}\n\nOs dados atuais serão salvos como uma versão antes da importação. Continuar?`)){ await registrarBackup('Antes da importação'); state=imported; state._backups=state._backups||[]; await saveData(); status.textContent='Backup importado com sucesso.'; render(); }
  }catch(err){ status.textContent='Arquivo inválido. Selecione um backup JSON do FinTrack.'; } };
  reader.readAsText(file);
}

function importarCSV(e){
  const file=e.target.files[0]; if(!file) return;
  const status=document.getElementById('backup-status'),reader=new FileReader();
  const parseLine=line=>{const cells=[];let cell='',quoted=false;for(let i=0;i<line.length;i++){const char=line[i];if(char==='"'&&line[i+1]==='"'){cell+='"';i++;continue;}if(char==='"'){quoted=!quoted;continue;}if(char===';'&&!quoted){cells.push(cell);cell='';}else cell+=char;}cells.push(cell);return cells;};
  reader.onload=async()=>{try{
    const lines=String(reader.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),rows=lines.slice(1).map(parseLine),valid=rows.filter(row=>row.length>=7);
    if(!lines.length||!valid.length){status.textContent='CSV inválido ou sem lançamentos.';return;}
    const findByName=(items,name)=>items.find(item=>String(item.nome||'').trim().toLowerCase()===String(name||'').trim().toLowerCase());
    const imported=valid.map((row,index)=>{const [data,vencimento,descricao,tipo,conta,categoria,valor,status='Pendente',fixa='Não']=row;const account=findByName(state.contas,conta),cat=findByName(state.categorias,categoria);return {id:uid('csv'),data,dataVencimento:vencimento||undefined,descricao:descricao.trim()||`Importado ${index+1}`,tipo:tipo==='Receita'?'Receita':'Despesa',contaId:account?.id||state.contas[0]?.id,categoriaId:cat?.id||state.categorias.find(item=>item.tipo===(tipo==='Receita'?'Entrada':'Saída'))?.id,valor:toCents(String(valor).replace(/\./g,'').replace(',','.')),status:status==='Pago'?'Pago':'Pendente',fixa:fixa==='Sim'};}).filter(item=>item.data&&item.contaId&&item.categoriaId&&item.valor>0);
    if(!imported.length){status.textContent='Nenhuma linha válida encontrada. Verifique contas, categorias e valores.';return;}
    if(confirm(`${imported.length} lançamento(s) válido(s) encontrado(s). Salvar backup e importar?`)){await registrarBackup('Antes da importação CSV');state.lancamentos.push(...imported);registrarHistorico('importacao_csv',`${imported.length} lançamento(s) importado(s)`);await saveData();status.textContent='CSV importado com sucesso.';render();}
  }catch(error){status.textContent='Não foi possível ler o CSV. Use separador ponto e vírgula.';}};
  reader.readAsText(file);
}

function criarDadosDemo(){
  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));
  base.usuario = { nome: state?.usuario?.nome || 'Vitoria' };
  base.lancamentos = [];
  const hoje=todayLocal();
  const primeiro=hoje.slice(0,8)+'01';
  const add=(offset,dia,descricao,tipo,contaId,categoriaId,valor,status='Pago',vencimento)=>{
    const mes=addMonths(primeiro,offset).slice(0,8);
    base.lancamentos.push({id:uid('demo'),tipo,data:mes+String(dia).padStart(2,'0'),dataVencimento:vencimento?mes+String(vencimento).padStart(2,'0'):undefined,descricao,contaId,categoriaId,valor,status,fixa:false});
  };
  [-2,-1,0].forEach((offset,i)=>{
    add(offset,5,'Salário','Receita','conta-bb','cat-receita',2000);
    add(offset,7,'Aluguel','Despesa','conta-inter','cat-moradia',650);
    add(offset,10,'Compras do mês','Despesa','conta-inter','cat-mercado',390+i*45);
    add(offset,12,'Assinaturas','Despesa','conta-inter','cat-assinaturas',39.90);
    add(offset,15,'Aporte mensal','Despesa','conta-bb','cat-investimento',250+i*50);
    add(offset,18,'Transferência entre contas','Despesa','conta-bb','cat-transferencia',180);
    add(offset,22,'Transporte','Despesa','conta-inter','cat-transporte',85+i*10);
  });
  add(0,25,'Conta de energia','Despesa','conta-inter','cat-contas',145,'Pendente',25);
  add(-1,28,'Internet residencial','Despesa','conta-inter','cat-contas',99.90,'Pendente',28);
  return normalizeData(base);
}

function carregarDemo(){
  confirmAction('Substituir os dados atuais por três meses de demonstração?', async () => {
    const anterior=snapshotAtual(); await registrarBackup('Antes da demonstração'); const backups=state._backups||[]; state=criarDadosDemo(); state._backups=backups; state.restauracaoDemo=anterior; state.modoDemo=true;
    await saveData();
    currentView='home';
    render();
  }, 'Carregar demonstração');
}

function apagarDemo(){
  const quantidade=state.lancamentos.filter(l=>String(l.id).startsWith('demo-')).length;
  if(!quantidade) return;
  confirmAction(`Apagar ${quantidade} lançamento(s) da demonstração? Seus lançamentos reais serão preservados.`, async () => {
    state.lancamentos=state.lancamentos.filter(l=>!String(l.id).startsWith('demo-')); state.modoDemo=false;
    await saveData();
    render();
  }, 'Apagar demonstração');
}

function restaurarDadosAnteriores(){
  if(!state.restauracaoDemo) return;
  confirmAction('Restaurar os dados salvos antes da demonstração?', async()=>{const backups=state._backups||[];state=normalizeData(state.restauracaoDemo);state._backups=backups;state.modoDemo=false;await saveData();render();},'Restaurar dados');
}
function restaurarBackup(index){
  const b=(state._backups||[])[index]; if(!b) return;
  if(confirm(`Restaurar a versão de ${new Date(b.criadoEm).toLocaleString('pt-BR')} com ${b.registros} registro(s)? Os dados atuais serão salvos antes da substituição.`)){
    registrarBackup('Antes da restauração').then(async()=>{const backups=state._backups||[];state=normalizeData(b.dados);state._backups=backups;await saveData();render();});
  }
}
